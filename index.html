    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PignuAnte</title>
    <meta
      name="description"
      content="개발자·여행자·창작자 PignuAnte의 픽셀 RPG 포트폴리오. 프로젝트 퀘스트 로그와 여행 월드맵."
    />
    <meta name="theme-color" content="#fafafa" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PignuAnte" />
    <meta
      property="og:title"
      content="PignuAnte — Developer. Traveler. Creator."
    />
    <meta
      property="og:description"
      content="개발자·여행자·창작자 PignuAnte의 픽셀 RPG 포트폴리오. 프로젝트 퀘스트 로그와 여행 월드맵."
    />
    <meta property="og:url" content="https://pignuante.github.io/" />
    <meta property="og:image" content="https://pignuante.github.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Pixel fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <!-- Color scheme init (prevents flash on reload) -->
    <script>
      (function () {
        var s = localStorage.getItem("pignuante-scheme");
        if (s && /^(aurora|peach|cotton|matcha)$/.test(s)) {
          document.documentElement.setAttribute("data-scheme", s);
        }
      })();
    </script>
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
